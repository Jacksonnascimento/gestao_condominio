# Os valores de cada ambiente vêm de variáveis de ambiente ou do arquivo .env na raiz do repositório
# (modelo em .env.example). O .env não vai para o git.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# === Banco de dados ===
# Servidor PostgreSQL da instalação. Com CLIENTES preenchida, só o nome do banco muda de um cliente para outro,
# e DB_NAME deixa de ser usado.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5444}/${DB_NAME:condigtal}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Clientes atendidos por esta instalação, cada um com o seu banco no mesmo servidor PostgreSQL, no formato
# identificador:banco[:dominio adicional...], separados por vírgula. O identificador é o subdomínio:
# residencialflores.condigtal.com.br e api.residencialflores.condigtal.com.br levam ao mesmo cliente.
# O banco que ainda não existir é criado na subida, já com as migrações. Sem a variável, a instalação atende
# um cliente só, no banco de DB_NAME.
condigtal.clientes=${CLIENTES:}

# Conexões com o banco de cada cliente: no máximo e ociosas.
condigtal.banco.conexoes-por-cliente=${DB_CONEXOES_POR_CLIENTE:10}
condigtal.banco.conexoes-ociosas-por-cliente=${DB_CONEXOES_OCIOSAS_POR_CLIENTE:2}

# Primeiro acesso: num banco de cliente sem nenhuma pessoa cadastrada, a subida cria um administrador com estes
# dados. Com alguém já cadastrado, nada é criado.
condigtal.administrador-inicial.email=${ADMINISTRADOR_INICIAL_EMAIL:}
condigtal.administrador-inicial.senha=${ADMINISTRADOR_INICIAL_SENHA:}
condigtal.administrador-inicial.cpf=${ADMINISTRADOR_INICIAL_CPF:}
condigtal.administrador-inicial.nome=${ADMINISTRADOR_INICIAL_NOME:}

# === Login da API (sistema web e aplicativo) ===
# Segredo que assina os tokens, com pelo menos 32 caracteres. Quem o conhece consegue entrar como qualquer pessoa.
condigtal.token.segredo=${TOKEN_SEGREDO:}
# Validade do token de acesso, em minutos, e do de renovação, em dias. O de renovação mantém o aplicativo logado.
condigtal.token.validade-minutos=${TOKEN_VALIDADE_MINUTOS:120}
condigtal.token.renovacao-validade-dias=${TOKEN_RENOVACAO_VALIDADE_DIAS:30}
# Origens do sistema web liberadas no CORS, separadas por vírgula; aceitam padrões como https://*.condigtal.com.br.
condigtal.cors.origens=${CORS_ORIGENS:http://localhost:3000,http://*.localhost:3000}
# Endereço do sistema web, base dos links enviados por e-mail (redefinição de senha). {cliente} vira o identificador
# do cliente: https://{cliente}.condigtal.com.br. Sem a variável, vale a origem de quem pediu.
condigtal.web.url-publica=${WEB_URL_PUBLICA:}

# Documentação da API em /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/v1/**

# === Migrações (Flyway) ===
# A estrutura do banco é dona do Flyway: src/main/resources/db/migration/V{n}__descricao.sql, com o próximo
# número livre. Migração já aplicada não se edita; mudança nova vira um arquivo novo. O Hibernate só confere
# se as entidades batem com o banco e recusa a subida se não baterem.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.org.springframework.security.config.annotation.authentication.configuration=ERROR
logging.level.root=INFO
logging.level.br.com.gestaocondominio.api=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

spring.main.lazy-initialization=true

# Configuração para aumentar o limite de upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# === Configuração de Email ===
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:condigtalgestaodecondominio@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=${MAIL_USERNAME:condigtalgestaodecondominio@gmail.com}
spring.mail.properties.mail.smtp.from-name=CONDIGTAL
