<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONDIGTAL - Gestão de Áreas Comuns</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="main-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='areas-comuns')}"></div>

    <div class="main-content">
        <header class="mobile-header">
            <button class="btn" id="sidebar-toggle-btn"><i class='bx bx-menu'></i></button>
            <span class="mobile-header-title">Gestão de Áreas Comuns</span>
        </header>

        <div class="content-body p-4">
            <div class="page-header d-flex flex-column flex-md-row justify-content-md-between align-items-md-center mb-4">
                <div class="text-center text-md-start">
                    <h1 class="page-title">Gestão de Áreas Comuns</h1>
                    <p class="page-subtitle d-none d-md-block">Cadastre os espaços de convivência e defina regras de uso.</p>
                </div>
                <div class="d-grid d-md-block mt-3 mt-md-0">
                    <button class="btn btn-primary" onclick="abrirModalNovaArea()">
                        <i class='bx bx-plus'></i> Nova Área
                    </button>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xxl-5 g-4 mb-4 d-none d-lg-flex">
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-unidades"><i class='bx bx-layer'></i></div><div><span class="label">Total</span><span class="value" th:text="${totalAreas}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-ocupantes"><i class='bx bx-check-circle'></i></div><div><span class="label">Ativas</span><span class="value" th:text="${totalAtivas}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-vazias"><i class='bx bx-x-circle'></i></div><div><span class="label">Inativas</span><span class="value" th:text="${totalInativas}">0</span></div></div></div></div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/areas-comuns}" method="get" class="d-flex flex-wrap gap-2">
                        <input type="search" name="busca" class="form-control" placeholder="Buscar por nome ou descrição..." th:value="${buscaFiltro}" style="flex: 1 1 250px;">
                        <select name="conCod" class="form-select" th:if="${showCondominioInfo}" onchange="this.form.submit()" style="flex: 1 1 200px;">
                            <option value="">Todos os Condomínios</option>
                            <option th:each="c : ${condominios}" th:value="${c.conCod}" th:text="${c.conNome}" th:selected="${c.conCod == conCodSelecionado}"></option>
                        </select>
                        <button type="submit" class="btn btn-secondary">Buscar</button>
                    </form>
                </div>
            </div>

            <div th:if="${areas.isEmpty()}" id="empty-placeholder" class="text-center p-5">
                <i class='bx bx-layer' style="font-size: 4rem; color: #ccc;"></i>
                <p class="mt-3">Nenhuma área comum encontrada para os filtros selecionados.</p>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="listaAreas">
                <th:block th:each="area : ${areas}">
                    <div class="col" th:id="'area-container-' + ${area.areCod}">
                        <div th:replace="~{fragments/area-comum-card :: card}"></div>
                    </div>
                </th:block>
            </div>
        </div>
    </div>
</div>

<th:block th:insert="~{fragments/area-comum-form :: modal}"></th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/areas-comuns.js}"></script>
</body>
</html>
