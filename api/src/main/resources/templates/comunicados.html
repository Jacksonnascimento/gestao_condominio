<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONDIGTAL - Mural de Comunicados</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <th:block th:with="currentPage='comunicados'"></th:block>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="main-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main-content">
        <header class="mobile-header">
            <button class="btn" id="sidebar-toggle-btn"><i class='bx bx-menu'></i></button>
            <span class="mobile-header-title">Mural de Comunicados</span>
        </header>
        <div class="content-body p-4">
            <div class="page-header d-flex flex-column flex-md-row justify-content-md-between align-items-md-center mb-4">
                <div class="text-center text-md-start">
                    <h1 class="page-title">Mural de Comunicados</h1>
                    <p class="page-subtitle d-none d-md-block">Visualize e gerencie os comunicados.</p>
                </div>
                <div class="d-grid d-md-block mt-3 mt-md-0" th:if="${usuarioPodeGerenciar}">
                    <button class="btn btn-primary" id="btnNovoComunicado">
                        <i class='bx bx-plus'></i> Novo Comunicado
                    </button>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/comunicados}" method="GET" class="row g-2 align-items-end">
                        <div class="col-12 col-lg"><label class="form-label">Título</label><input type="text" class="form-control" name="titulo" th:value="${filtroTitulo}" placeholder="Buscar por Título"></div>
                        <div class="col-12 col-lg"><label class="form-label">Mensagem</label><input type="text" class="form-control" name="mensagem" th:value="${filtroMensagem}" placeholder="Buscar na Mensagem"></div>
                        <div class="col-12 col-lg-auto" th:if="${usuarioPodeGerenciar}"><label class="form-label">Público</label>
                            <select class="form-select" name="publicoDestino">
                                <option value="">Todos</option>
                                <option th:each="p : ${T(br.com.gestaocondominio.api.domain.enums.PublicoDestino).values()}"
                                        th:value="${p.name()}" th:text="${p.getDescricao()}"
                                        th:selected="${p.name() == filtroPublico}">
                                </option>
                            </select>
                        </div>
                        <div class="col-12 col-lg-auto"><label class="form-label">Urgência</label><select class="form-select" name="isUrgente"><option value="">Todos</option><option value="true" th:selected="${filtroUrgente == true}">Urgentes</option><option value="false" th:selected="${filtroUrgente == false}">Não Urgentes</option></select></div>
                        <div class="col-12 col-lg-auto"><button type="submit" class="btn btn-secondary w-100"><i class='bx bx-filter-alt'></i> Filtrar</button></div>
                        <div class="col-12 col-lg-auto"><a th:href="@{/comunicados}" class="btn btn-outline-secondary w-100"><i class='bx bx-eraser'></i> Limpar</a></div>
                    </form>
                </div>
            </div>

            <div th:if="${comunicadosPage.empty}" id="empty-placeholder" class="text-center p-5">
                <i class='bx bx-message-alt-x' style="font-size: 4rem; color: #ccc;"></i>
                <p class="mt-3">Nenhum comunicado encontrado para os filtros selecionados.</p>
            </div>

            <div th:if="${not comunicadosPage.empty}" id="lista-comunicados">
                <th:block th:each="comunicado : ${comunicadosPage.content}">
                    <div th:replace="~{fragments/comunicado-card :: card(comunicado=${comunicado}, usuarioPodeGerenciar=${usuarioPodeGerenciar}, isGlobalAdmin=${isGlobalAdmin}, allCondominios=${allCondominios})}"></div>
                </th:block>
            </div>

            <nav aria-label="Page navigation" th:if="${comunicadosPage != null and comunicadosPage.totalPages > 1}" class="mt-4 d-flex justify-content-center">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${comunicadosPage.first} ? 'disabled'"><a class="page-link" th:href="@{/comunicados(page=0, size=${comunicadosPage.size}, titulo=${filtroTitulo}, mensagem=${filtroMensagem}, publicoDestino=${filtroPublico}, isUrgente=${filtroUrgente})}">Primeira</a></li>
                    <li class="page-item" th:classappend="${comunicadosPage.first} ? 'disabled'"><a class="page-link" th:href="@{/comunicados(page=${comunicadosPage.number - 1}, size=${comunicadosPage.size}, titulo=${filtroTitulo}, mensagem=${filtroMensagem}, publicoDestino=${filtroPublico}, isUrgente=${filtroUrgente})}">Anterior</a></li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, comunicadosPage.totalPages - 1)}" th:classappend="${i == comunicadosPage.number} ? 'active'"><a class="page-link" th:href="@{/comunicados(page=${i}, size=${comunicadosPage.size}, titulo=${filtroTitulo}, mensagem=${filtroMensagem}, publicoDestino=${filtroPublico}, isUrgente=${filtroUrgente})}" th:text="${i + 1}"></a></li>
                    <li class="page-item" th:classappend="${comunicadosPage.last} ? 'disabled'"><a class="page-link" th:href="@{/comunicados(page=${comunicadosPage.number + 1}, size=${comunicadosPage.size}, titulo=${filtroTitulo}, mensagem=${filtroMensagem}, publicoDestino=${filtroPublico}, isUrgente=${filtroUrgente})}">Próxima</a></li>
                    <li class="page-item" th:classappend="${comunicadosPage.last} ? 'disabled'"><a class="page-link" th:href="@{/comunicados(page=${comunicadosPage.totalPages - 1}, size=${comunicadosPage.size}, titulo=${filtroTitulo}, mensagem=${filtroMensagem}, publicoDestino=${filtroPublico}, isUrgente=${filtroUrgente})}">Última</a></li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" id="modalContent"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/comunicados.js}"></script>

</body>
</html>
