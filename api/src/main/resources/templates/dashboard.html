<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CONDOFLOW - Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <div class="sidebar" th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Dashboard</h1>
                    <p class="page-subtitle">Visão geral do condomínio e principais indicadores</p>
                </div>
            </div>
    
            <div class="summary-cards dashboard-cards">
                <div class="card">
                    <div class="card-icon icon-unidades">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h7.5" /></svg>
                    </div>
                    <div>
                        <span class="label">Total de Unidades</span>
                        <span class="value" th:text="${totalUnidades}">0</span>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon icon-ocupantes">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m-7.5-2.964A3 3 0 0115 12a3 3 0 01-3 3m-3-3a3 3 0 100-6 3 3 0 000 6zM21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    </div>
                    <div>
                        <span class="label">Ocupantes Ativos</span>
                        <span class="value">350</span>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon icon-funcionarios">
                         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
                    </div>
                    <div>
                        <span class="label">Funcionários</span>
                        <span class="value" th:text="${totalUsuarios}">0</span>
                    </div>
                </div>
                <div class="card">
                    <div class="card-icon icon-contratos">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>
                    </div>
                    <div>
                        <span class="label">Contratos Ativos</span>
                        <span class="value">40</span>
                    </div>
                </div>
            </div>
        
            <div class="dashboard-widgets">
                <div class="widget-card">
                    <h3 class="card-title">Ocorrências Pendentes</h3>
                    <p class="widget-value">3</p>
                    <p class="widget-subtitle">Ocorrências requerem atenção</p>
                </div>
                <div class="widget-card">
                    <h3 class="card-title">Próxima Assembleia</h3>
                    <p class="widget-main-text">Assembleia Ordinária</p>
                    <p class="widget-details">
                        <span>Data: 15/09/2025</span>
                        <span>Tipo: Ordinária</span>
                        <span>Modalidade: Presencial</span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
