<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONDIGTAL - Gestão de Encomendas</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="main-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='encomendas')}"></div>

    <div class="main-content">
        <header class="mobile-header">
            <button class="btn" id="sidebar-toggle-btn"><i class='bx bx-menu'></i></button>
            <span class="mobile-header-title">Gestão de Encomendas</span>
        </header>

        <div class="content-body p-4">
            <div class="page-header d-flex flex-column flex-md-row justify-content-md-between align-items-md-center mb-4">
                <div class="text-center text-md-start">
                    <h1 class="page-title">Gestão de Encomendas</h1>
                    <p class="page-subtitle d-none d-md-block">Controle de recebimento e retirada de encomendas.</p>
                </div>
                <div class="d-grid d-md-block mt-3 mt-md-0" th:if="${usuarioPodeGerenciarEncomendas}">
                    <button class="btn btn-primary" id="btnNovaEncomenda">
                        <i class='bx bx-plus'></i> Nova Encomenda
                    </button>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xxl-5 g-4 mb-4 d-none d-lg-flex">
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-encomenda-total"><i class='bx bx-collection'></i></div><div><span class="label">Total</span><span class="value" th:text="${totais['TOTAL'] ?: 0}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-encomenda-pendente"><i class='bx bx-time-five'></i></div><div><span class="label">Pendentes</span><span class="value" th:text="${totais['PENDENTES'] ?: 0}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-encomenda-retirada"><i class='bx bx-check-double'></i></div><div><span class="label">Retiradas</span><span class="value" th:text="${totais['RETIRADAS'] ?: 0}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-encomenda-devolvida"><i class='bx bx-undo'></i></div><div><span class="label">Devolvidas</span><span class="value" th:text="${totais['DEVOLVIDAS'] ?: 0}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-encomenda-extraviada"><i class='bx bx-error-alt'></i></div><div><span class="label">Extraviadas</span><span class="value" th:text="${totais['EXTRAVIADAS'] ?: 0}">0</span></div></div></div></div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/encomendas}" method="get" class="row g-2 align-items-end">
                        <div class="col-12 col-md-6 col-lg"><label class="form-label">Busca</label><input type="search" name="busca" class="form-control" placeholder="Buscar por destinatário, descrição..." th:value="${buscaFiltro}"></div>
                        <div class="col-12 col-md-6 col-lg" th:if="${showCondominioInfo}"><label class="form-label">Condomínio</label><select name="condominioId" class="form-select"><option value="">Todos</option><option th:each="c : ${condominiosDisponiveis}" th:value="${c.conCod}" th:text="${c.conNome}" th:selected="${c.conCod == condominioFiltro}"></option></select></div>
                        <div class="col-12 col-md-4 col-lg-auto" th:if="${usuarioPodeGerenciarEncomendas}"><label class="form-label">Unidade</label><select name="unidadeId" class="form-select"><option value="">Todas</option><option th:each="u : ${unidadesDisponiveis}" th:value="${u.uniCod}" th:text="${u.uniNumero} + (${u.bloco != null ? ' - ' + u.bloco : ''})" th:selected="${u.uniCod == unidadeFiltro}"></option></select></div>
                        <div class="col-12 col-md-4 col-lg-auto"><label class="form-label">Status</label><select name="status" class="form-select"><option value="">Todos</option><option th:each="s : ${statusDisponiveis}" th:value="${s.key}" th:text="${s.value}" th:selected="${s.key == statusFiltro?.name()}"></option></select></div>
                        <div class="col-12 col-md-4 col-lg-auto"><button type="submit" class="btn btn-secondary w-100"><i class='bx bx-filter-alt'></i> Filtrar</button></div>
                        <div class="col-12 col-md-4 col-lg-auto"><a th:href="@{/encomendas}" class="btn btn-outline-secondary w-100"><i class='bx bx-eraser'></i> Limpar</a></div>
                    </form>
                </div>
            </div>

            <div th:if="${encomendasPage.empty}" id="empty-placeholder" class="text-center p-5">
                <i class='bx bx-package' style="font-size: 4rem; color: #ccc;"></i>
                <p class="mt-3">Nenhuma encomenda encontrada para os filtros selecionados.</p>
            </div>

            <div th:if="${not encomendasPage.empty}" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="lista-encomendas">
                <th:block th:each="enc : ${encomendasPage.content}">
                    <div th:replace="~{fragments/encomenda-card :: card(enc=${enc}, showCondominioInfo=${showCondominioInfo}, usuarioPodeGerenciarEncomendas=${usuarioPodeGerenciarEncomendas})}"></div>
                </th:block>
            </div>

            <nav aria-label="Page navigation" th:if="${encomendasPage != null and encomendasPage.totalPages > 1}" class="mt-4 d-flex justify-content-center">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${encomendasPage.first} ? 'disabled'"><a class="page-link" th:href="@{/encomendas(page=0, size=${encomendasPage.size}, condominioId=${condominioFiltro}, busca=${buscaFiltro}, unidadeId=${unidadeFiltro}, status=${statusFiltro?.name()})}">Primeira</a></li>
                    <li class="page-item" th:classappend="${encomendasPage.first} ? 'disabled'"><a class="page-link" th:href="@{/encomendas(page=${encomendasPage.number - 1}, size=${encomendasPage.size}, condominioId=${condominioFiltro}, busca=${buscaFiltro}, unidadeId=${unidadeFiltro}, status=${statusFiltro?.name()})}">Anterior</a></li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, encomendasPage.totalPages - 1)}" th:classappend="${i == encomendasPage.number} ? 'active'"><a class="page-link" th:href="@{/encomendas(page=${i}, size=${encomendasPage.size}, condominioId=${condominioFiltro}, busca=${buscaFiltro}, unidadeId=${unidadeFiltro}, status=${statusFiltro?.name()})}" th:text="${i + 1}"></a></li>
                    <li class="page-item" th:classappend="${encomendasPage.last} ? 'disabled'"><a class="page-link" th:href="@{/encomendas(page=${encomendasPage.number + 1}, size=${encomendasPage.size}, condominioId=${condominioFiltro}, busca=${buscaFiltro}, unidadeId=${unidadeFiltro}, status=${statusFiltro?.name()})}">Próxima</a></li>
                    <li class="page-item" th:classappend="${encomendasPage.last} ? 'disabled'"><a class="page-link" th:href="@{/encomendas(page=${encomendasPage.totalPages - 1}, size=${encomendasPage.size}, condominioId=${condominioFiltro}, busca=${buscaFiltro}, unidadeId=${unidadeFiltro}, status=${statusFiltro?.name()})}">Última</a></li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" id="modalContent">
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/encomendas.js}"></script>
</body>
</html>
