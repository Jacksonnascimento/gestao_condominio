<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<body>
<form th:fragment="contratoForm" id="contratoForm" th:action="@{${contrato.id == null} ? '/contratos/novo' : '/contratos/editar/' + ${contrato.id}}" th:object="${contrato}" method="post">
    <div class="modal-header">
        <h5 class="modal-title" th:text="${contrato.id == null} ? 'Novo Contrato' : 'Editar Contrato'"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <input type="hidden" th:field="*{id}" />
        
        <div class="row g-3">
            <div class="col-12" th:if="${isGlobalAdmin}">
                <label for="condominioId" class="form-label">Condomínio *</label>
                <select id="condominioId" class="form-select" th:field="*{condominioId}" required>
                    <option value="">Selecione um condomínio</option>
                    <option th:each="c : ${condominiosDisponiveis}" th:value="${c.conCod}" th:text="${c.conNome}"></option>
                </select>
            </div>
            <input th:if="${!isGlobalAdmin}" type="hidden" th:field="*{condominioId}" />

            <div class="col-md-8">
                <label for="empresa" class="form-label">Empresa *</label>
                <input type="text" id="empresa" class="form-control" th:field="*{empresa}" required>
            </div>
            <div class="col-md-4">
                <label for="valor" class="form-label">Valor (R$) *</label>
                <input type="number" id="valor" class="form-control" th:field="*{valor}" step="0.01" required>
            </div>
            <div class="col-12">
                <label for="servico" class="form-label">Serviço *</label>
                <input type="text" id="servico" class="form-control" th:field="*{servico}" required>
            </div>
            <div class="col-md-6">
                <label for="responsavel" class="form-label">Responsável</label>
                <input type="text" id="responsavel" class="form-control" th:field="*{responsavel}">
            </div>
            <div class="col-md-6">
                <label for="status" class="form-label">Status</label>
                <select id="status" class="form-select" th:field="*{status}">
                    <option value="">Ativo</option>
                    <option th:each="s : ${statusDisponiveis}"
                            th:if="${s.name() == 'FINALIZADO' or s.name() == 'RESCINDIDO'}"
                            th:value="${s}" th:text="${s.descricao}"></option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="dataInicio" class="form-label">Data Início *</label>
                <input type="date" id="dataInicio" class="form-control" th:field="*{dataInicio}" required>
            </div>
            <div class="col-md-6">
                <label for="dataFim" class="form-label">Data Fim *</label>
                <input type="date" id="dataFim" class="form-control" th:field="*{dataFim}" required>
            </div>
            <div class="col-12">
                <label for="observacoes" class="form-label">Observações</label>
                <textarea id="observacoes" class="form-control" th:field="*{observacoes}" rows="3"></textarea>
            </div>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar</button>
    </div>
</form>
</body>
</html>
