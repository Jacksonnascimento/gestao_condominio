<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="form-modal-content">
    <div class="modal-header">
        <h5 class="modal-title" id="formModalLabel">Meu Perfil</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <form id="perfilForm" th:action="@{/perfil/salvar-senha}" method="post">
        <div class="modal-body">
            <h6 class="section-title">Informações Pessoais</h6>
            <div class="row g-3 mb-3">
                <div class="col-12">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" th:value="${usuario.pesNome}" readonly disabled>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:value="${usuario.pesEmail}" readonly disabled>
                </div>
                 <div class="col-md-6">
                    <label class="form-label">CPF/CNPJ</label>
                    <input type="text" class="form-control" th:value="${usuario.pesCpfCnpj}" readonly disabled>
                </div>
            </div>
            
            <hr class="my-4">

            <h6 class="section-title">Alterar Senha</h6>
             <div class="row g-3">
                 <div class="col-12">
                    <label for="senhaAtual" class="form-label">Senha Atual *</label>
                    <input type="password" class="form-control" id="senhaAtual" name="senhaAtual" required>
                 </div>
                 <div class="col-md-6">
                    <label for="novaSenha" class="form-label">Nova Senha *</label>
                    <input type="password" class="form-control" id="novaSenha" name="novaSenha" required>
                 </div>
                 <div class="col-md-6">
                    <label for="confirmarNovaSenha" class="form-label">Confirmar Nova Senha *</label>
                    <input type="password" class="form-control" id="confirmarNovaSenha" name="confirmarNovaSenha" required>
                 </div>
             </div>

        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        </div>
    </form>
</div>
</body>
</html>
