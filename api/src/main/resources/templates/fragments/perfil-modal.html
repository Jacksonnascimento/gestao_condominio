<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="form-modal-content">
    <div class="modal-header">
        <h5 class="modal-title" id="formModalLabel">Meu Perfil</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    
    <div class="modal-body">
        <form id="perfilDadosForm" th:action="@{/perfil/salvar-dados}" method="post">
            <h6 class="section-title">Informações Pessoais</h6>
            <div class="row g-3 mb-3">
                <div class="col-12">
                    <label for="pesNome" class="form-label">Nome *</label>
                    <input type="text" class="form-control" id="pesNome" name="pesNome" th:value="${usuario.pesNome}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:value="${usuario.pesEmail}" readonly disabled>
                </div>
                 <div class="col-md-6">
                    <label class="form-label">CPF/CNPJ</label>
                    <input type="text" class="form-control" th:value="${usuario.pesCpfCnpj}" readonly disabled>
                </div>
            </div>
            <div class="d-flex justify-content-end">
                <button type="submit" class="btn btn-primary">Salvar Dados</button>
            </div>
        </form>
        
        <hr class="my-4">

        <form id="perfilSenhaForm" th:action="@{/perfil/salvar-senha}" method="post">
            <h6 class="section-title">Alterar Senha</h6>
             <div class="row g-3">
                 <div class="col-12">
                    <label for="senhaAtual" class="form-label">Senha Atual *</label>
                    <input type="password" class="form-control" id="senhaAtual" name="senhaAtual" required>
                 </div>
                 <div class="col-md-6">
                    <label for="novaSenha" class="form-label">Nova Senha *</label>
                    <input type="password" class="form-control" id="novaSenha" name="novaSenha" required>
                 </div>
                 <div class="col-md-6">
                    <label for="confirmarNovaSenha" class="form-label">Confirmar Nova Senha *</label>
                    <input type="password" class="form-control" id="confirmarNovaSenha" name="confirmarNovaSenha" required>
                 </div>
             </div>
             <div class="d-flex justify-content-end mt-3">
                <button type="submit" class="btn btn-primary">Salvar Nova Senha</button>
            </div>
        </form>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
    </div>
</div>
</body>
</html>
