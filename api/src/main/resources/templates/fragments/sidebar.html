<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<body>
    <div id="sidebar" class="sidebar d-flex flex-column flex-shrink-0 p-3" th:fragment="sidebar">
        <a th:href="@{/dashboard}"
            class="d-flex flex-column align-items-center mb-3 mb-md-0 text-decoration-none sidebar-logo-area">
            <img th:src="@{/images/logo.png}" alt="CONDIGTAL Logo" class="sidebar-logo">
            <span class="sidebar-title">CONDIGTAL</span>
        </a>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a th:href="@{/dashboard}" class="nav-link"
                    th:classappend="${currentPage == 'dashboard' ? 'active' : ''}">
                    <i class='bx bxs-dashboard'></i> Dashboard
                </a>
            </li>
            <li>
                <a th:href="@{/unidades}" class="nav-link"
                    th:classappend="${currentPage == 'unidades' ? 'active' : ''}">
                    <i class='bx bxs-building-house'></i> Unidades
                </a>
            </li>
            <li>
                <a th:href="@{/ocupantes}" class="nav-link"
                    th:classappend="${currentPage == 'ocupantes' ? 'active' : ''}">
                    <i class='bx bxs-group'></i> Ocupantes
                </a>
            </li>
            <li th:if="${usuarioPodeVisualizarVisitantes}">
                <a th:href="@{/visitantes}" class="nav-link"
                   th:classappend="${currentPage == 'visitantes' ? 'active' : ''}">
                    <i class='bx bxs-id-card'></i> Visitantes
                </a>
            </li>
            <li th:if="${usuarioPodeGerenciar}">
                <a th:href="@{/contratos}" class="nav-link"
                    th:classappend="${currentPage == 'contratos' ? 'active' : ''}">
                    <i class='bx bxs-file-doc'></i> Contratos
                </a>
            </li>
            <li>
                <a th:href="@{/comunicados}" class="nav-link"
                    th:classappend="${currentPage == 'comunicados' ? 'active' : ''}">
                    <i class='bx bxs-message-detail'></i> Mural de Comunicados
                </a>
            </li>
            <li>
                <a th:href="@{/ocorrencias}" class="nav-link"
                    th:classappend="${currentPage == 'ocorrencias' ? 'active' : ''}">
                    <i class='bx bxs-comment-error'></i> Ocorrências
                </a>
            </li>
            <li>
                <a th:href="@{/encomendas}" class="nav-link"
                   th:classappend="${currentPage == 'encomendas' ? 'active' : ''}">
                    <i class='bx bxs-package'></i> Encomendas
                </a>
            </li>
        </ul>
        <div class="sidebar-footer pt-3 mt-auto">
            
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" id="userDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="user-info">
                        <i class='bx bxs-user-circle fs-5 align-middle flex-shrink-0'></i>
                        <span class="fw-bold username" th:text="${nomeUsuarioLogado}">Nome do Usuário</span>
                    </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="userDropdown">
                    <li><a class="dropdown-item" href="#" id="btnMeuPerfil"><i class='bx bxs-cog me-2'></i> Meu Perfil</a></li>
                    <li th:if="${isUsuarioAdmin}"><a class="dropdown-item" th:href="@{/usuarios}"><i class='bx bxs-user-cog me-2'></i> Admin. Usuários</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="dropdown-item text-danger">
                                <i class='bx bx-log-out me-2'></i> Sair
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
            
            <div class="d-flex justify-content-center mt-3">
                 <button class="btn btn-outline-secondary" id="theme-toggler" type="button" aria-label="Toggle theme">
                    <i class='bx bxs-sun' id="theme-toggler-light"></i>
                    <i class='bx bxs-moon d-none' id="theme-toggler-dark"></i>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
