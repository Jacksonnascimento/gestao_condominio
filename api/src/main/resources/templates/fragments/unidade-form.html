<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="form-modal-content">
    <div class="modal-header">
        <h5 class="modal-title" id="formModalLabel" th:text="${unidadeId != null ? 'Editar Unidade ' + unidade.uniNumero : 'Nova Unidade'}"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <form id="unidadeForm" th:object="${unidade}"
          th:action="${unidadeId != null ? '/unidades/editar/' + unidadeId : '/unidades/salvar'}"
          method="post">
        <div class="modal-body">
            <div class="mb-3" th:if="${showCondominioInfo}">
                <label for="conCod" class="form-label">Condomínio *</label>
                <select id="conCod" class="form-select" th:field="*{conCod}" required>
                    <option value="">Selecione o Condomínio...</option>
                    <option th:each="condo : ${condominiosDisponiveis}" th:value="${condo.conCod}" th:text="${condo.conNome}"></option>
                </select>
            </div>
            <input type="hidden" th:if="${!showCondominioInfo}" th:field="*{conCod}" />

            <div class="row g-3">
                <div class="col-md-6">
                    <label for="uniNumero" class="form-label">Número da Unidade *</label>
                    <input type="text" class="form-control" id="uniNumero" th:field="*{uniNumero}" required>
                </div>
                <div class="col-md-6">
                    <label for="bloco" class="form-label">Bloco</label>
                    <input type="text" class="form-control" id="bloco" th:field="*{bloco}">
                </div>
                <div class="col-md-6">
                    <label for="andar" class="form-label">Andar</label>
                    <input type="text" class="form-control" id="andar" th:field="*{andar}">
                </div>
                <div class="col-md-6">
                    <label for="fracaoIdeal" class="form-label">Fração Ideal</label>
                    <input type="number" class="form-control" id="fracaoIdeal" th:field="*{fracaoIdeal}" placeholder="Ex: 1.2345" step="0.0001" min="0">
                </div>
                <div class="col-md-6">
                    <label for="areaPrivada" class="form-label">Área Privativa (m²)</label>
                    <input type="number" class="form-control" id="areaPrivada" th:field="*{areaPrivada}" placeholder="Ex: 70.50" step="0.01" min="0">
                </div>
                <div class="col-md-6">
                    <label for="unidadeTipo" class="form-label">Tipo da Unidade *</label>
                    <select id="unidadeTipo" class="form-select" th:field="*{unidadeTipo}" required>
                        <option value="">Selecione...</option>
                        <option th:each="tipo : ${tiposUnidade}" th:value="${tipo}" th:text="${tipo.getDescricao()}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <label for="uniStatusOcupacao" class="form-label">Status *</label>
                    <select id="uniStatusOcupacao" class="form-select" th:field="*{uniStatusOcupacao}" required>
                        <option th:each="s : ${statusOcupacao}" th:value="${s}" th:text="${s.getDescricao()}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <label for="observacao" class="form-label">Observações</label>
                    <textarea id="observacao" class="form-control" rows="3" th:field="*{observacao}"></textarea>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" th:text="${unidadeId != null ? 'Salvar Alterações' : 'Salvar'}"></button>
        </div>
    </form>
</th:block>
</body>
</html>
