<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="form-modal-content">
    <div class="modal-header">
        <h5 class="modal-title">Editar Usuário</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <form id="usuarioEditForm" th:object="${usuarioDTO}" th:action="@{/usuarios/editar}" method="post">
        <div class="modal-body">
            
            <input type="hidden" id="pessoaId" name="pessoaId" th:value="*{pessoaId}" />
            <input type="hidden" id="condominioId" name="condominioId" th:value="*{condominioId}" />
            <input type="hidden" id="oldPapel" name="oldPapel" th:value="*{papel}" />

            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label">Condomínio</label>
                    <input type="text" class="form-control" th:value="*{condominioNome}" readonly disabled>
                </div>
                 <div class="col-12">
                    <label for="pessoaNome" class="form-label">Usuário (Nome) *</label>
                    <input type="text" class="form-control" id="pessoaNome" name="pessoaNome" th:value="*{pessoaNome}" required>
                </div>
                <div class="col-12">
                    <label for="email" class="form-label">Email (Login) *</label>
                    <input type="email" class="form-control" id="email" name="email" th:value="*{pessoaEmail}" required>
                </div>
                <div class="col-12">
                    <label for="newPapel" class="form-label">Papel (Role) *</label>
                    <select id="newPapel" name="newPapel" class="form-select" required>
                        <option value="">Selecione...</option>
                        <option th:each="r : ${rolesDisponiveis}" 
                                th:value="${r.name()}" 
                                th:text="${r.getDescricao()}"
                                th:selected="${r == usuarioDTO.papel}">
                        </option>
                    </select>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
        </div>
    </form>
</div>
</body>
</html>
