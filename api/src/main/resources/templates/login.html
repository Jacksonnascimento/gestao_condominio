<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONDIGTAL - Login</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/login-style.css}">
</head>
<body>
<div class="container-fluid h-100">
    <div class="row h-100">

        <div class="col-lg-5 d-flex align-items-center justify-content-center">
            <div class="form-container">
                <h1 class="text-center fw-bold">CONDIGTAL</h1>
                <p class="text-center text-muted mb-4">Bem-vindo(a) de volta! Faça login para continuar.</p>

                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    Email ou senha inválidos.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Email</label>
                        <input type="email" class="form-control" id="username" name="username" placeholder="seuemail@exemplo.com" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Sua senha" required>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                            <label class="form-check-label" for="remember-me">
                                Lembrar-me
                            </label>
                        </div>
                        <a href="#" class="small">Esqueci minha senha</a>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">LOGIN</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-7 d-none d-lg-block p-0">
            <div class="image-section h-100"></div>
        </div>

    </div>
</div>
</body>
</html>
