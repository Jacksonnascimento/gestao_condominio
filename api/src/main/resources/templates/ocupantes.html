<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CONDOFLOW - Gestão de Ocupantes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
</head>
<body>
<div class="main-container">
    <div class="sidebar" th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Gestão de Ocupantes</h1>
                <p class="page-subtitle">Controle e gerencie os vínculos dos ocupantes com as unidades.</p>
            </div>
            <button class="btn-primary" th:onclick="'openForm(\'/ocupantes/novo?condominioId=' + (${condominioFiltro} ?: '') + '\')'">
                <i class="fa-solid fa-plus btn-icon"></i>
                Novo Ocupante
            </button>
        </div>

        <div class="summary-cards" style="grid-template-columns: repeat(6, 1fr);">
            <div class="card"><div class="card-icon icon-total"><i class="fa-solid fa-users"></i></div><div><span class="label">Total</span><span class="value" th:text="${totalOcupantes}">0</span></div></div>
            <div class="card"><div class="card-icon icon-proprietario"><i class="fa-solid fa-user-tie"></i></div><div><span class="label">Proprietários</span><span class="value" th:text="${totalProprietarios}">0</span></div></div>
            <div class="card"><div class="card-icon icon-locatario"><i class="fa-solid fa-user-tag"></i></div><div><span class="label">Locatários</span><span class="value" th:text="${totalLocatarios}">0</span></div></div>
            <div class="card"><div class="card-icon icon-promitente"><i class="fa-solid fa-handshake"></i></div><div><span class="label">Promitentes</span><span class="value" th:text="${totalPromitentes}">0</span></div></div>
            <div class="card"><div class="card-icon icon-cessionario"><i class="fa-solid fa-file-signature"></i></div><div><span class="label">Cessionários</span><span class="value" th:text="${totalCessionarios}">0</span></div></div>
            <div class="card"><div class="card-icon icon-multiproprietario"><i class="fa-solid fa-users-viewfinder"></i></div><div><span class="label">Multiprop.</span><span class="value" th:text="${totalMultiproprietarios}">0</span></div></div>
        </div>

        <div class="filter-container">
            <form th:action="@{/ocupantes}" method="get" class="search-form">
                <input type="search" name="busca" placeholder="Buscar por nome ou email..." th:value="${buscaFiltro}">
                <select th:if="${showCondominioInfo}" name="condominioId">
                    <option value="">Todos os Condomínios</option>
                    <option th:each="c : ${condominiosDisponiveis}" th:value="${c.conCod}" th:text="${c.conNome}" th:selected="${c.conCod == condominioFiltro}"></option>
                </select>
                <select name="vinculo">
                    <option value="">Todos os Vínculos</option>
                    <option th:each="v : ${vinculosDisponiveis}" th:value="${v.name()}" th:text="${v.getDescricao()}" th:selected="${v == vinculoFiltro}"></option>
                </select>
                <button type="submit" class="btn-secondary">Filtrar</button>
            </form>
        </div>

        <div class="units-grid">
            <div class="unit-card" th:each="ocupante : ${ocupantes}">
                <div class="card-header">
                    <div>
                        <div th:if="${showCondominioInfo}" class="condo-badge" th:text="${ocupante.unidade.condominio.conNome}"></div>
                        <h3 th:text="${ocupante.pessoa.pesNome}"></h3>
                    </div>
                    <span class="status" th:text="${ocupante.ocuVinculo.getDescricao()}" th:classappend="${'status-' + #strings.toLowerCase(ocupante.ocuVinculo.name())}"></span>
                </div>
                <div class="card-body">
                    <p class="info-item"><i class="fa-solid fa-building info-icon"></i><strong>Unidade:</strong> <span th:text="${ocupante.unidade.uniNumero} + (${ocupante.unidade.bloco != null ? ' / ' + ocupante.unidade.bloco : ''})"></span></p>
                    <p class="info-item"><i class="fa-solid fa-envelope info-icon"></i><strong>Email:</strong> <span th:text="${ocupante.pessoa.pesEmail}"></span></p>
                    <p class="info-item"><i class="fa-solid fa-phone info-icon"></i><strong>Telefone:</strong> <span th:text="${ocupante.pessoa.pesTelefone}"></span></p>
                    <p class="info-item"><i class="fa-solid fa-calendar-alt info-icon"></i><strong>Início:</strong> <span th:text="${#temporals.format(ocupante.ocuDtInicioOcupacao, 'dd/MM/yyyy')}"></span></p>
                </div>
                <div class="card-footer">
                    <button class="btn-edit" th:onclick="'openForm(\'/ocupantes/editar/' + ${ocupante.ocuCod} + '\')'"><i class="fa-solid fa-pencil btn-icon-sm"></i>Editar</button>
                    <form th:action="@{/ocupantes/excluir/{id}(id=${ocupante.ocuCod})}" method="post" style="display:inline;">
                        <button type="submit" class="btn-delete" onclick="return confirm('Deseja excluir este ocupante?');"><i class="fa-solid fa-trash btn-icon-sm"></i>Excluir</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="formModal" class="modal">
    <div class="modal-content" id="modalContent"></div>
</div>

<script>
    const modal = document.getElementById('formModal');
    const modalContent = document.getElementById('modalContent');

    async function openForm(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Falha ao carregar o formulário.');
            modalContent.innerHTML = await response.text();
            modal.style.display = 'flex';
        } catch (error) {
            console.error('Erro:', error); // Troquei 'alert' por 'console.error' para melhor depuração
            alert('Não foi possível carregar o formulário.');
        }
    }

    function closeModal() {
        modal.style.display = 'none';
        modalContent.innerHTML = '';
    }

    window.onclick = function(event) {
        if (event.target == modal) {
            closeModal();
        }
    }
</script>
</body>
</html>
