<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONDIGTAL - Gestão de Ocupantes</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="main-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <header class="mobile-header">
            <button class="btn" id="sidebar-toggle-btn"><i class='bx bx-menu'></i></button>
            <span class="mobile-header-title">Gestão de Ocupantes</span>
        </header>

        <div class="content-body p-4">
            <div class="page-header d-flex flex-column flex-md-row justify-content-md-between align-items-md-center mb-4">
                <div class="text-center text-md-start">
                    <h1 class="page-title">Gestão de Ocupantes</h1>
                    <p class="page-subtitle d-none d-md-block" th:if="${isGerencial}">Controle e gerencie os vínculos dos ocupantes com as unidades.</p>
                    <p class="page-subtitle d-none d-md-block" th:unless="${isGerencial}">Gerencie os ocupantes das suas unidades.</p>
                </div>
                <div class="d-grid d-md-block mt-3 mt-md-0">
                    <button class="btn btn-primary" id="btnNovoOcupante">
                        <i class='bx bx-plus'></i> Novo Ocupante
                    </button>
                </div>
            </div>

            <div th:if="${isGerencial}" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xxl-6 g-4 mb-4 d-none d-lg-flex">
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-ocupantes"><i class='bx bxs-group'></i></div><div><span class="label">Total</span><span class="value" th:text="${totalOcupantes}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-proprietario"><i class='bx bxs-user-account'></i></div><div><span class="label">Proprietários</span><span class="value" th:text="${totalProprietarios}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-locatario"><i class='bx bxs-user-detail'></i></div><div><span class="label">Locatários</span><span class="value" th:text="${totalLocatarios}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-promitente"><i class='bx bxs-key'></i></div><div><span class="label">Promitentes</span><span class="value" th:text="${totalPromitentes}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-cessionario"><i class='bx bxs-file-import'></i></div><div><span class="label">Cessionários</span><span class="value" th:text="${totalCessionarios}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-multiproprietario"><i class='bx bxs-share-alt'></i></div><div><span class="label">Multiprop.</span><span class="value" th:text="${totalMultiproprietarios}">0</span></div></div></div></div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/ocupantes}" method="get" class="d-flex flex-wrap gap-2">
                        <input type="search" name="busca" class="form-control" placeholder="Buscar por nome ou email..." th:value="${buscaFiltro}" style="flex: 1 1 200px;">
                        <select name="vinculo" class="form-select" style="flex: 1 1 180px;" th:if="${isGerencial}">
                            <option value="">Todos os Vínculos</option>
                            <option th:each="v : ${vinculosDisponiveis}" th:value="${v.name()}" th:text="${v.getDescricao()}" th:selected="${v == vinculoFiltro}"></option>
                        </select>
                        <select name="unidadeId" class="form-select" style="flex: 1 1 180px;" th:if="${isGerencial or (#lists.size(unidadesDoMorador) > 1)}">
                            <option value="">Todas as Unidades</option>
                            <option th:each="u : ${unidadesDisponiveis}" th:value="${u.uniCod}" th:text="${u.uniNumero}" th:selected="${u.uniCod == unidadeFiltro}"></option>
                        </select>
                        <button type="submit" class="btn btn-secondary">Filtrar</button>
                    </form>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
                <div class="col" th:each="ocupante : ${ocupantes}">
                    <div class="card unit-card h-100">
                        <div class="card-header">
                            <div>
                                <span th:if="${showCondominioInfo}" class="badge bg-secondary mb-1" th:text="${ocupante.condominioNome}"></span>
                                <h3 class="card-title h6 mb-0" th:text="${ocupante.nomeCompleto}"></h3>
                            </div>
                            <span class="status-badge" th:text="${ocupante.vinculo.getDescricao()}" th:classappend="${'status-' + #strings.toLowerCase(ocupante.vinculo.name())}"></span>
                        </div>
                        <div class="card-body">
                            <p class="info-item"><i class='bx bxs-building-house'></i><strong>Unidade:</strong> <span th:text="${ocupante.unidadeNumero} + (${ocupante.unidadeBloco != null ? ' / ' + ocupante.unidadeBloco : ''})"></span></p>
                            <p class="info-item"><i class='bx bxs-envelope'></i><strong>Email:</strong> <span th:text="${ocupante.email}"></span></p>
                            <p class="info-item"><i class='bx bxs-phone'></i><strong>Telefone:</strong> <span th:text="${ocupante.telefone}"></span></p>
                            <p class="info-item"><i class='bx bxs-calendar-check'></i><strong>Início:</strong> <span th:text="${#temporals.format(ocupante.inicioOcupacao, 'dd/MM/yyyy')}"></span></p>
                        </div>
                        <div class="card-footer">
                            <button class="btn btn-sm btn-outline-primary btn-edit" th:data-url="'/ocupantes/editar/' + ${ocupante.id}"><i class='bx bxs-edit'></i> Editar</button>
                            <form th:action="@{/ocupantes/excluir/{id}(id=${ocupante.id})}" method="post" class="d-inline" onsubmit="return confirm('Deseja realmente excluir este ocupante?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class='bx bxs-trash'></i> Excluir</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" id="modalContent"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/ocupantes.js}"></script>
</body>
</html>
