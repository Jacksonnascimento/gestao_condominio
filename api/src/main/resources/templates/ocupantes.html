<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CONDOFLOW - Gestão de Ocupantes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <div class="sidebar" th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Gestão de Ocupantes</h1>
                    <p class="page-subtitle">Controle e gerencie os vínculos dos ocupantes com as unidades.</p>
                </div>
                <button class="btn-primary" onclick="openForm('/ocupantes/novo')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="btn-icon"><path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" /></svg>
                    Novo Ocupante
                </button>
            </div>

            <div class="summary-cards" style="grid-template-columns: repeat(6, 1fr);">
                <div class="card"><div class="card-icon icon-total"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m-7.5-2.964A3 3 0 0115 12a3 3 0 01-3 3m-3-3a3 3 0 100-6 3 3 0 000 6zM21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div><div><span class="label">Total</span><span class="value" th:text="${totalOcupantes}">0</span></div></div>
                <div class="card"><div class="card-icon icon-proprietario"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg></div><div><span class="label">Proprietários</span><span class="value" th:text="${totalProprietarios}">0</span></div></div>
                <div class="card"><div class="card-icon icon-locatario"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 21v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21m0 0h4.5V3.545M12.75 21h7.5V10.75M2.25 21h1.5m18 0h-1.5m-15-13.5H18M15 7.5h3" /></svg></div><div><span class="label">Locatários</span><span class="value" th:text="${totalLocatarios}">0</span></div></div>
                <div class="card"><div class="card-icon icon-promitente"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg></div><div><span class="label">Promitentes</span><span class="value" th:text="${totalPromitentes}">0</span></div></div>
                <div class="card"><div class="card-icon icon-cessionario"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m6.75 12h9m-9 3h9m-9-6h9M3.75 9h15v12H3.75V9z" /></svg></div><div><span class="label">Cessionários</span><span class="value" th:text="${totalCessionarios}">0</span></div></div>
                <div class="card"><div class="card-icon icon-multiproprietario"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m-7.5-2.964A3 3 0 0115 12a3 3 0 01-3 3m-3-3a3 3 0 100-6 3 3 0 000 6zM21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div><div><span class="label">Multiprop.</span><span class="value" th:text="${totalMultiproprietarios}">0</span></div></div>
            </div>
            
            <div class="filter-container">
                 <form th:action="@{/ocupantes}" method="get" class="search-form">
                    <input type="search" name="busca" placeholder="Buscar por nome ou email..." th:value="${buscaFiltro}">
                    <select name="vinculo">
                        <option value="">Todos os Vínculos</option>
                        <option th:each="v : ${vinculosDisponiveis}" th:value="${v.name()}" th:text="${v.getDescricao()}" th:selected="${v.name() == vinculoFiltro}"></option>
                    </select>
                    <select name="unidadeId">
                        <option value="">Todas as Unidades</option>
                        <option th:each="u : ${unidadesDisponiveis}" th:value="${u.uniCod}" th:text="${u.uniNumero}" th:selected="${u.uniCod == unidadeFiltro}"></option>
                    </select>
                    <button type="submit" class="btn-secondary">Filtrar</button>
                </form>
            </div>

            <div class="units-grid">
                <div class="unit-card" th:each="ocupante : ${ocupantes}">
                    <div class="card-header">
                        <div>
                            <div th:if="${isMultiCondo}" class="condo-badge" th:text="${ocupante.condominioNome}"></div>
                            <h3 th:text="${ocupante.nomeCompleto}"></h3>
                        </div>
                        <span class="status" th:text="${ocupante.vinculo.getDescricao()}" th:classappend="${'status-' + #strings.toLowerCase(ocupante.vinculo.name())}"></span>
                    </div>
                    <div class="card-body">
                         <p class="info-item"><svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M2.5 5.5A2.5 2.5 0 0 1 5 3h10a2.5 2.5 0 0 1 2.5 2.5v10A2.5 2.5 0 0 1 15 18H5a2.5 2.5 0 0 1-2.5-2.5v-10Z" /><path d="M5 4.5a.5.5 0 0 0-.5.5v10a.5.5 0 0 0 .5.5h10a.5.5 0 0 0 .5-.5v-10a.5.5 0 0 0-.5-.5H5Z" /></svg><strong>Unidade:</strong> <span th:text="${ocupante.unidadeNumero} + (${ocupante.unidadeBloco != null ? ' / ' + ocupante.unidadeBloco : ''})"></span></p>
                        <p class="info-item"><svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M3 4a2 2 0 0 0-2 2v1.161l8.441 4.221a1.25 1.25 0 0 0 1.118 0L19 7.162V6a2 2 0 0 0-2-2H3Z" /><path d="M19 8.839l-7.77 3.885a2.75 2.75 0 0 1-2.46 0L1 8.839V14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.839Z" /></svg><strong>Email:</strong> <span th:text="${ocupante.email}"></span></p>
                        <p class="info-item"><svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M2 3.5A1.5 1.5 0 0 1 3.5 2h1.148a1.5 1.5 0 0 1 1.465 1.175l.716 3.223a1.5 1.5 0 0 1-1.052 1.767l-.933.267c-.41.117-.643.555-.48.95a11.542 11.542 0 0 0 6.254 6.254c.395.163.833-.07.95-.48l.267-.933a1.5 1.5 0 0 1 1.767-1.052l3.223.716A1.5 1.5 0 0 1 18 15.352V16.5a1.5 1.5 0 0 1-1.5 1.5h-2.148a1.5 1.5 0 0 1-1.465-1.175l-.716-3.223a1.5 1.5 0 0 1 1.052-1.767l.933-.267c.41-.117.643.555.48-.95A11.542 11.542 0 0 0 9.048 3.95c-.395-.163-.833.07-.95.48l-.267.933a1.5 1.5 0 0 1-1.767 1.052l-3.223-.716A1.5 1.5 0 0 1 2 4.648V3.5Z" clip-rule="evenodd" /></svg><strong>Telefone:</strong> <span th:text="${ocupante.telefone}"></span></p>
                        <p class="info-item"><svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.75 2a.75.75 0 0 1 .75.75V4h7V2.75a.75.75 0 0 1 1.5 0V4h.25A2.75 2.75 0 0 1 18 6.75v8.5A2.75 2.75 0 0 1 15.25 18H4.75A2.75 2.75 0 0 1 2 15.25v-8.5A2.75 2.75 0 0 1 4.75 4H5V2.75A.75.75 0 0 1 5.75 2Zm-1 5.5a.75.75 0 0 0 0 1.5h10.5a.75.75 0 0 0 0-1.5H4.75Z" clip-rule="evenodd" /></svg><strong>Início:</strong> <span th:text="${#temporals.format(ocupante.inicioOcupacao, 'dd/MM/yyyy')}"></span></p>
                    </div>
                    <div class="card-footer">
                        <button class="btn-edit" th:onclick="'openForm(\'/ocupantes/editar/' + ${ocupante.id} + '\')'"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="btn-icon-sm"><path d="m2.695 14.762-1.262 3.155a.5.5 0 0 0 .65.65l3.155-1.262a4 4 0 0 0 1.343-.885l11.516-11.515a2.5 2.5 0 0 0-3.536-3.536L3.58 13.42a4 4 0 0 0-.885 1.343Z" /></svg>Editar</button>
                        <form th:action="@{/ocupantes/excluir/{id}(id=${ocupante.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn-delete" onclick="return confirm('Deseja excluir este ocupante?');"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="btn-icon-sm"><path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 0 0 6 3.75v.443c-.795.077-1.58.22-2.365.468a.75.75 0 1 0 .23 1.482l.149-.022.841 10.518A2.75 2.75 0 0 0 7.596 19h4.807a2.75 2.75 0 0 0 2.742-2.53l.841-10.52.149.023a.75.75 0 0 0 .23-1.482A41.03 41.03 0 0 0 14 4.193V3.75A2.75 2.75 0 0 0 11.25 1h-2.5ZM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4ZM8.58 7.72a.75.75 0 0 0-1.5.06l.3 7.5a.75.75 0 1 0 1.5-.06l-.3-7.5Zm4.34.06a.75.75 0 1 0-1.5-.06l-.3 7.5a.75.75 0 1 0 1.5.06l.3-7.5Z" clip-rule="evenodd" /></svg>Excluir</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="formModal" class="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>
    
    <script>
        const modal = document.getElementById('formModal');
        const modalContent = document.getElementById('modalContent');

        async function openForm(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Falha ao carregar o formulário.');
                modalContent.innerHTML = await response.text();
                modal.style.display = 'flex';
                // Roda a função de toggle assim que o formulário é inserido na página
                toggleMultipropriedadeFields();
            } catch (error) {
                console.error('Erro:', error);
                alert('Não foi possível carregar o formulário.');
            }
        }

        function closeModal() {
            modal.style.display = 'none';
            modalContent.innerHTML = '';
        }
        
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        // --- LÓGICA DO FORMULÁRIO CENTRALIZADA AQUI ---

        // Escuta o evento de 'submit' que acontece dentro do modalContent
        modalContent.addEventListener('submit', async function(event) {
            // Verifica se o evento veio do nosso formulário específico
            if (event.target.id === 'ocupanteForm') {
                event.preventDefault(); // Impede o envio padrão que trava a tela

                const form = event.target;
                const formData = new FormData(form);
                const url = form.action;

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        body: new URLSearchParams(formData)
                    });

                    if (response.ok) {
                        window.location.reload();
                    } else {
                        const errorData = await response.json();
                        alert(errorData.message);
                    }
                } catch (error) {
                    console.error('Erro ao enviar formulário:', error);
                    alert('Não foi possível comunicar com o servidor.');
                }
            }
        });

        // Escuta o evento de 'blur' (perda de foco) no campo de CPF
        modalContent.addEventListener('blur', function(event) {
            if (event.target.id === 'pesCpfCnpj') {
                buscarPessoaPorCpf(event.target);
            }
        }, true); // O 'true' ajuda a capturar o evento de forma mais confiável

        // Escuta o evento de 'change' no seletor de Vínculo
        modalContent.addEventListener('change', function(event) {
            if (event.target.id === 'vinculo') {
                toggleMultipropriedadeFields();
            }
        });
        
        async function buscarPessoaPorCpf(cpfInput) {
            const cpf = cpfInput.value;
            const h2 = modalContent.querySelector('h2');

            if ((h2 && h2.textContent.startsWith('Editar')) || !cpf || cpf.length < 11) {
                return;
            }
            try {
                const response = await fetch(`/api/pessoas/por-cpf/${cpf}`);
                const nomeInput = document.getElementById('pesNome');
                const emailInput = document.getElementById('pesEmail');
                const telefoneInput = document.getElementById('pesTelefone');
                
                if (response.ok) {
                    const pessoa = await response.json();
                    nomeInput.value = pessoa.pesNome;
                    emailInput.value = pessoa.pesEmail;
                    telefoneInput.value = pessoa.pesTelefone;
                    nomeInput.readOnly = true;
                    emailInput.readOnly = true;
                    telefoneInput.readOnly = true;
                } else {
                    nomeInput.value = '';
                    emailInput.value = '';
                    telefoneInput.value = '';
                    nomeInput.readOnly = false;
                    emailInput.readOnly = false;
                    telefoneInput.readOnly = false;
                }
            } catch (error) {
                console.error('Erro ao buscar pessoa:', error);
            }
        }

        function toggleMultipropriedadeFields() {
            const vinculoSelect = document.getElementById('vinculo');
            const fields = document.getElementById('multipropriedade-fields');
            if (vinculoSelect && fields) {
                fields.style.display = (vinculoSelect.value === 'MULTIPROPRIETARIO') ? 'block' : 'none';
            }
        }
    </script>
</body>
</html>
