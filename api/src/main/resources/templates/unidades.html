<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONDIGTAL - Gestão de Unidades</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="main-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-content">
        <header class="mobile-header">
            <button class="btn" id="sidebar-toggle-btn"><i class='bx bx-menu'></i></button>
            <span class="mobile-header-title">Gestão de Unidades</span>
        </header>

        <div class="content-body p-4">
            <div class="page-header d-flex flex-column flex-md-row justify-content-md-between align-items-md-center mb-4">
                <div class="text-center text-md-start">
                    <h1 class="page-title">Gestão de Unidades</h1>
                    <p class="page-subtitle d-none d-md-block">Controle e acompanhe todas as unidades do condomínio</p>
                </div>
                <div class="d-grid d-md-block mt-3 mt-md-0" th:if="${isGerencial}">
                    <button class="btn btn-primary" id="btnNovaUnidade">
                        <i class='bx bx-plus'></i> Nova Unidade
                    </button>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xxl-5 g-4 mb-4 d-none d-lg-flex">
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-unidades"><i class='bx bxs-building-house'></i></div><div><span class="label">Total</span><span class="value" th:text="${totalUnidades}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-ocupantes"><i class='bx bxs-user-check'></i></div><div><span class="label">Ocupadas</span><span class="value" th:text="${totalOcupadas}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-vazias"><i class='bx bxs-door-open'></i></div><div><span class="label">Vazias</span><span class="value" th:text="${totalVazias}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-multipropriedade"><i class='bx bxs-share-alt'></i></div><div><span class="label">Multipropriedade</span><span class="value" th:text="${totalMultipropriedade}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-reforma"><i class='bx bxs-paint-roll'></i></div><div><span class="label">Em Reforma</span><span class="value" th:text="${totalEmReforma}">0</span></div></div></div></div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/unidades}" method="get" class="d-flex flex-wrap gap-2">
                        <input type="hidden" name="status" th:value="${statusFiltro}" />
                        <input type="search" name="busca" class="form-control" placeholder="Buscar por número ou bloco..." th:value="${buscaFiltro}" style="flex: 1 1 250px;">
                        <select name="condominioId" class="form-select" th:if="${showCondominioInfo}" onchange="this.form.submit()" style="flex: 1 1 200px;">
                            <option value="">Todos os Condomínios</option>
                            <option th:each="c : ${condominiosDisponiveis}" th:value="${c.conCod}" th:text="${c.conNome}" th:selected="${c.conCod == condominioFiltro}"></option>
                        </select>
                        <button type="submit" class="btn btn-secondary">Buscar</button>
                    </form>
                </div>
            </div>

            <ul class="nav nav-pills filter-tabs mb-4">
                <li class="nav-item"><a class="nav-link" th:href="@{/unidades(condominioId=${condominioFiltro}, busca=${buscaFiltro})}" th:classappend="${statusFiltro == null or statusFiltro == ''} ? 'active'">Todos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/unidades(status='OCUPADA', condominioId=${condominioFiltro}, busca=${buscaFiltro})}" th:classappend="${statusFiltro == 'OCUPADA'} ? 'active'">Ocupada</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/unidades(status='VAZIA', condominioId=${condominioFiltro}, busca=${buscaFiltro})}" th:classappend="${statusFiltro == 'VAZIA'} ? 'active'">Vazia</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/unidades(status='EM_REFORMA', condominioId=${condominioFiltro}, busca=${buscaFiltro})}" th:classappend="${statusFiltro == 'EM_REFORMA'} ? 'active'">Em Reforma</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/unidades(status='MULTIPROPRIEDADE', condominioId=${condominioFiltro}, busca=${buscaFiltro})}" th:classappend="${statusFiltro == 'MULTIPROPRIEDADE'} ? 'active'">Multipropriedade</a></li>
            </ul>

            <div th:if="${unidades.isEmpty()}" id="empty-placeholder" class="text-center p-5">
                <i class='bx bx-building' style="font-size: 4rem; color: #ccc;"></i>
                <p class="mt-3">Nenhuma unidade encontrada para os filtros selecionados.</p>
            </div>

            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="lista-unidades">
                <th:block th:each="unidade : ${unidades}">
                    <div th:replace="~{fragments/unidade-card :: card(unidade=${unidade}, showCondominioInfo=${showCondominioInfo})}"></div>
                </th:block>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" id="modalContent">
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/unidades.js}"></script>
</body>
</html>
