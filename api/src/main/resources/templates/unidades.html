<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CONDOFLOW - Gestão de Unidades</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .btn-details { font-size: 0.8rem; padding: 6px 12px; border-radius: 4px; border: 1px solid #3b82f6; cursor: pointer; background-color: #3b82f6; color: white; display: flex; align-items: center; gap: 6px; transition: background-color 0.2s, color 0.2s, border-color 0.2s; }
        .btn-details:hover { background-color: #2563eb; border-color: #2563eb; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
        .details-section h3 { font-size: 1.1rem; color: #3b82f6; border-bottom: 2px solid #f0f0f0; padding-bottom: 8px; margin-top: 20px; margin-bottom: 15px;}
        .details-section .info-item { margin-bottom: 12px; }
        .details-section .info-item strong { min-width: 100px; display: inline-block; }
        .ocupantes-list ul { list-style: none; padding: 0; }
        .ocupantes-list li { background-color: #f9fafb; padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #3b82f6; }
        .ocupantes-list li .ocupante-header { font-size: 1rem; font-weight: 600; color: var(--text-color); }
        .ocupantes-list li .ocupante-details { font-size: 0.85rem; color: var(--text-light-color); display: block; margin-top: 4px; }
        .no-ocupantes { color: var(--text-light-color); font-style: italic; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="sidebar" th:replace="~{fragments/sidebar :: sidebar}"></div>

        <div class="content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Gestão de Unidades</h1>
                    <p class="page-subtitle">Controle e acompanhe todas as unidades do condomínio</p>
                </div>
                <button th:if="${isGerencial}" class="btn-primary" onclick="openForm('/unidades/novo')">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="btn-icon"><path d="M10.75 4.75a.75.75 0 0 0-1.5 0v4.5h-4.5a.75.75 0 0 0 0 1.5h4.5v4.5a.75.75 0 0 0 1.5 0v-4.5h4.5a.75.75 0 0 0 0-1.5h-4.5v-4.5Z" /></svg>
                    Nova Unidade
                </button>
            </div>

            <div class="summary-cards">
                <div class="card"><div class="card-icon icon-total"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h7.5" /></svg></div><div><span class="label">Total</span><span class="value" th:text="${totalUnidades}">0</span></div></div>
                <div class="card"><div class="card-icon icon-ocupantes"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m-7.5-2.964A3 3 0 0115 12a3 3 0 01-3 3m-3-3a3 3 0 100-6 3 3 0 000 6zM21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div><div><span class="label">Ocupadas</span><span class="value" th:text="${totalOcupadas}">0</span></div></div>
                <div class="card"><div class="card-icon icon-vazias"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h6M9 11.25h6M9 15.75h6" /></svg></div><div><span class="label">Vazias</span><span class="value" th:text="${totalVazias}">0</span></div></div>
                <div class="card"><div class="card-icon icon-multipropriedade"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.186 2.25 2.25 0 00-3.933 2.186z" /></svg></div><div><span class="label">Multipropriedade</span><span class="value" th:text="${totalMultipropriedade}">0</span></div></div>
                <div class="card"><div class="card-icon icon-reforma"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.472-2.472a3.375 3.375 0 00-4.773-4.773L6.23 15.729a3.375 3.375 0 004.773 4.773l2.472-2.472z" /></svg></div><div><span class="label">Em Reforma</span><span class="value" th:text="${totalEmReforma}">0</span></div></div>
            </div>
            
            <div class="filter-container">
                 <form th:action="@{/unidades}" method="get" class="search-form">
                     <input type="search" name="busca" placeholder="Buscar por número ou bloco..." th:value="${buscaFiltro}">
                     <select name="status" th:if="${isGerencial}">
                         <option value="">Todos os Status</option>
                         <option th:each="s : ${statusOcupacao}" th:value="${s.name()}" th:text="${s.getDescricao()}" th:selected="${s.name() == statusFiltro}"></option>
                     </select>
                     <select name="condominioId" th:if="${showCondominioInfo}">
                         <option value="">Todos os Condomínios</option>
                         <option th:each="c : ${condominiosDisponiveis}" th:value="${c.conCod}" th:text="${c.conNome}" th:selected="${c.conCod == condominioFiltro}"></option>
                     </select>
                     <button th:if="${isGerencial or showCondominioInfo}" type="submit" class="btn-secondary">Filtrar</button>
                 </form>
            </div>

            <div class="units-grid">
                <div class="unit-card" th:each="unidade : ${unidades}">
                    <div class="card-header">
                        <div>
                            <div th:if="${showCondominioInfo}" class="condo-badge" th:text="${unidade.condominio.conNome}"></div>
                            <h3 th:text="'Unidade ' + ${unidade.uniNumero}"></h3>
                        </div>
                        <span class="status" th:if="${unidade.uniStatusOcupacao != null}" th:text="${unidade.uniStatusOcupacao.getDescricao()}" th:classappend="${'status-' + #strings.toLowerCase(unidade.uniStatusOcupacao.name())}"></span>
                    </div>
                    <div class="card-body">
                        <p class="info-item"><svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.5 2A1.5 1.5 0 0 0 3 3.5v13A1.5 1.5 0 0 0 4.5 18h11a1.5 1.5 0 0 0 1.5-1.5V7.621a1.5 1.5 0 0 0-.44-1.06l-4.12-4.122A1.5 1.5 0 0 0 11.378 2H4.5ZM10 8a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75h-.008a.75.75 0 0 1-.75-.75v-.008c0-.414.336-.75.75-.75h.008ZM10 13.5a.75.75 0 0 1 .75-.75h.008a.75.75 0 0 1 .75.75v.008a.75.75 0 0 1-.75.75h-.008a.75.75 0 0 1-.75-.75v-.008Z" clip-rule="evenodd" /></svg><strong>Bloco:</strong> <span th:text="${unidade.bloco}"></span></p>
                        <p class="info-item"><svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M10 3.75a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5a.75.75 0 0 1 .75-.75Z" /><path fill-rule="evenodd" d="M10 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16ZM5.932 4.043a.75.75 0 0 1 0 1.06l-1.8 1.8a.75.75 0 1 1-1.06-1.06l1.8-1.8a.75.75 0 0 1 1.06 0Zm10.136 0a.75.75 0 0 1 1.06 0l1.8 1.8a.75.75 0 1 1-1.06 1.06l-1.8-1.8a.75.75 0 0 1 0-1.06ZM10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" clip-rule="evenodd" /></svg><strong>Fração Ideal:</strong> <span th:text="${unidade.fracaoIdeal != null ? #numbers.formatDecimal(unidade.fracaoIdeal * 100, 1, 4) + '%' : 'N/A'}"></span></p>
                        <p class="info-item"><svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M2.5 5.5A2.5 2.5 0 0 1 5 3h10a2.5 2.5 0 0 1 2.5 2.5v10A2.5 2.5 0 0 1 15 18H5a2.5 2.5 0 0 1-2.5-2.5v-10Z" /><path d="M5 4.5a.5.5 0 0 0-.5.5v10a.5.5 0 0 0 .5.5h10a.5.5 0 0 0 .5-.5v-10a.5.5 0 0 0-.5-.5H5Z" /></svg><strong>Área:</strong> <span th:text="${unidade.areaPrivada != null ? unidade.areaPrivada + ' m²' : 'N/A'}"></span></p>
                        <p class="info-item"><svg class="info-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-2 0c0 .993-.241 1.929-.668 2.754l-1.524-1.525a.75.75 0 0 0-1.06 1.06l1.524 1.525A4.483 4.483 0 0 1 10 14.5a4.5 4.5 0 0 1-2.754-.668l-1.525 1.524a.75.75 0 0 0 1.06 1.06l1.525-1.524A4.483 4.483 0 0 1 5.5 10c0-.993.241-1.929.668-2.754l1.524 1.525a.75.75 0 0 0 1.06-1.06l-1.524-1.525A4.483 4.483 0 0 1 10 5.5a4.5 4.5 0 0 1 2.754.668l1.525-1.524a.75.75 0 0 0-1.06-1.06l-1.525 1.524A4.483 4.483 0 0 1 14.5 10Z" clip-rule="evenodd" /></svg><strong>Tipo:</strong> <span th:text="${unidade.unidadeTipo != null ? unidade.unidadeTipo.getDescricao() : 'Não definido'}"></span></p>
                    </div>
                    <div class="card-footer">
                        <button class="btn-details" th:onclick="'openDetails(' + ${unidade.uniCod} + ')'">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="btn-icon-sm"><path fill-rule="evenodd" d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0ZM9.25 9.25a.75.75 0 0 0-1.5 0v4.5a.75.75 0 0 0 1.5 0v-4.5Zm1.25.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z" clip-rule="evenodd" /></svg>
                            Detalhes
                        </button>
                        <th:block th:if="${isGerencial}">
                            <button class="btn-edit" th:onclick="'openForm(\'/unidades/editar/' + ${unidade.uniCod} + '\')'"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="btn-icon-sm"><path d="m2.695 14.762-1.262 3.155a.5.5 0 0 0 .65.65l3.155-1.262a4 4 0 0 0 1.343-.885l11.516-11.515a2.5 2.5 0 0 0-3.536-3.536L3.58 13.42a4 4 0 0 0-.885 1.343Z" /></svg>Editar</button>
                            <form th:action="@{'/unidades/excluir/' + ${unidade.uniCod}}" method="post" style="display:inline;"><button type="submit" class="btn-delete" onclick="return confirm('Deseja excluir esta unidade?');"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="btn-icon-sm"><path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 0 0 6 3.75v.443c-.795.077-1.58.22-2.365.468a.75.75 0 1 0 .23 1.482l.149-.022.841 10.518A2.75 2.75 0 0 0 7.596 19h4.807a2.75 2.75 0 0 0 2.742-2.53l.841-10.52.149.023a.75.75 0 0 0 .23-1.482A41.03 41.03 0 0 0 14 4.193V3.75A2.75 2.75 0 0 0 11.25 1h-2.5ZM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4ZM8.58 7.72a.75.75 0 0 0-1.5.06l.3 7.5a.75.75 0 1 0 1.5-.06l-.3-7.5Zm4.34.06a.75.75 0 1 0-1.5-.06l-.3 7.5a.75.75 0 1 0 1.5.06l.3-7.5Z" clip-rule="evenodd" /></svg>Excluir</button></form>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="formModal" class="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>
    
    <script>
        const modal = document.getElementById('formModal');
        const modalContent = document.getElementById('modalContent');

        async function openForm(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Falha ao carregar o formulário.');
                modalContent.innerHTML = await response.text();
                modal.style.display = 'flex';
            } catch (error) {
                console.error('Erro:', error);
                alert('Não foi possível carregar o formulário.');
            }
        }

        function closeModal() {
            modal.style.display = 'none';
            modalContent.innerHTML = '';
        }
        
        window.onclick = function(event) {
            if (event.target == modal) {
                closeModal();
            }
        }

        async function openDetails(unidadeId) {
            modalContent.innerHTML = '<div class="modal-header"><h2>Carregando Detalhes...</h2></div>';
            modal.style.display = 'flex';

            const NA = 'N/A';

            const formatDate = (dateString) => {
                if (!dateString) return null;
                const date = new Date(dateString);
                const day = String(date.getDate()).padStart(2, '0');
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const year = date.getFullYear();
                return `${day}/${month}/${year}`;
            };

            try {
                const [unidadeResponse, ocupantesResponse] = await Promise.all([
                    fetch(`/api/unidades/${unidadeId}`),
                    fetch(`/api/ocupantes?unidadeId=${unidadeId}`)
                ]);

                if (!unidadeResponse.ok) throw new Error(`Erro ao buscar unidade: ${unidadeResponse.statusText}`);
                if (!ocupantesResponse.ok) throw new Error(`Erro ao buscar ocupantes: ${ocupantesResponse.statusText}`);

                const unidade = await unidadeResponse.json();
                const ocupantes = await ocupantesResponse.json();
                
                let ocupantesHtml = '<p class="no-ocupantes">Nenhum ocupante encontrado para esta unidade.</p>';
                if (ocupantes.length > 0) {
                    ocupantesHtml = '<ul>' + ocupantes.map(o => {
                        const vinculo = o.vinculo && o.vinculo.descricao ? `(${o.vinculo.descricao})` : '';
                        const ocupacaoFim = formatDate(o.fimOcupacao) || 'Atual';
                        const ocupacaoInicio = formatDate(o.inicioOcupacao) || NA;

                        return `
                        <li>
                            <span class="ocupante-header">${o.nomeCompleto || NA} ${vinculo}</span>
                            <span class="ocupante-details">${o.email || NA} | ${o.telefone || NA}</span>
                            <span class="ocupante-details">Ocupação: ${ocupacaoInicio} até ${ocupacaoFim}</span>
                        </li>
                    `}).join('') + '</ul>';
                }

                const detailsHtml = `
                    <div class="modal-header">
                        <h2>Detalhes da Unidade ${unidade.uniNumero || ''}</h2>
                        <button onclick="closeModal()" class="close-btn">&times;</button>
                    </div>
                    <div class="details-section">
                        <h3>Informações da Unidade</h3>
                        <div class="details-grid">
                            <p class="info-item"><strong>Bloco:</strong> <span>${unidade.bloco || NA}</span></p>
                            <p class="info-item"><strong>Andar:</strong> <span>${unidade.andar || NA}</span></p>
                            <p class="info-item"><strong>Fração Ideal:</strong> <span>${unidade.fracaoIdeal ? (unidade.fracaoIdeal * 100).toFixed(4).replace('.', ',') + '%' : NA}</span></p>
                            <p class="info-item"><strong>Área:</strong> <span>${unidade.areaPrivada ? unidade.areaPrivada + ' m²' : NA}</span></p>
                            <p class="info-item"><strong>Tipo:</strong> <span>${unidade.unidadeTipo ? unidade.unidadeTipo.descricao : NA}</span></p>
                            <p class="info-item"><strong>Status:</strong> <span>${unidade.uniStatusOcupacao ? unidade.uniStatusOcupacao.descricao : NA}</span></p>
                        </div>
                        <p class="info-item"><strong>Observações:</strong> <span>${unidade.observacao || 'Nenhuma'}</span></p>
                    </div>
                    <div class="details-section ocupantes-list">
                        <h3>Ocupantes</h3>
                        ${ocupantesHtml}
                    </div>
                `;
                
                modalContent.innerHTML = detailsHtml;

            } catch (error) {
                console.error('Erro ao abrir detalhes:', error);
                modalContent.innerHTML = `
                    <div class="modal-header">
                        <h2>Erro ao Carregar</h2>
                        <button onclick="closeModal()" class="close-btn">&times;</button>
                    </div>
                    <p>Não foi possível carregar os detalhes da unidade. Por favor, tente novamente.</p>`;
            }
        }
    </script>
</body>
</html>
