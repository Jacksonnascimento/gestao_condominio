<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONDIGTAL - Administração de Usuários</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="main-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='usuarios')}"></div>

    <div class="main-content">
        <header class="mobile-header">
            <button class="btn" id="sidebar-toggle-btn"><i class='bx bx-menu'></i></button>
            <span class="mobile-header-title">Admin. Usuários</span>
        </header>

        <div class="content-body p-4">
            <div class="page-header d-flex flex-column flex-md-row justify-content-md-between align-items-md-center mb-4">
                <div class="text-center text-md-start">
                    <h1 class="page-title">Administração de Usuários</h1>
                    <p class="page-subtitle d-none d-md-block">Gerencie os acessos ao sistema.</p>
                </div>
                <div class="d-grid d-md-block mt-3 mt-md-0">
                    <button class="btn btn-primary" id="btnNovoUsuario">
                        <i class='bx bx-plus'></i> Novo Usuário
                    </button>
                </div>
            </div>

            <div class="card mb-4" th:if="${isGlobalAdmin and showCondominioInfo}">
                <div class="card-body">
                    <form th:action="@{/usuarios}" method="get" class="d-flex flex-wrap gap-2">
                        <select name="condominioId" class="form-select" style="flex: 1 1 200px;" onchange="this.form.submit()">
                            <option value="">Selecione um Condomínio</option>
                            <option th:each="c : ${condominiosDisponiveis}" th:value="${c.conCod}" th:text="${c.conNome}" th:selected="${c.conCod == condominioFiltro}"></option>
                        </select>
                    </form>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(usuarios)}" id="empty-placeholder" class="text-center p-5">
                <i class='bx bx-user-x' style="font-size: 4rem; color: #ccc;"></i>
                <p class="mt-3" th:text="${condominioFiltro == null ? 'Selecione um condomínio para ver os usuários.' : 'Nenhum usuário encontrado.'}"></p>
            </div>

            <div th:if="${not #lists.isEmpty(usuarios)}" class="card d-none d-lg-block">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>Papel</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-usuarios-desktop">
                            <th:block th:each="usuario : ${usuarios}">
                                <tr th:replace="~{fragments/usuario-row :: row(usuario=${usuario}, isGlobalAdmin=${isGlobalAdmin}, showCondominioInfo=${showCondominioInfo})}"></tr>
                            </th:block>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:if="${not #lists.isEmpty(usuarios)}" class="row row-cols-1 row-cols-md-2 g-4 d-block d-lg-none" id="lista-usuarios-mobile">
                <th:block th:each="usuario : ${usuarios}">
                    <div class="col" th:replace="~{fragments/usuario-row :: card(usuario=${usuario}, isGlobalAdmin=${isGlobalAdmin}, showCondominioInfo=${showCondominioInfo})}"></div>
                </th:block>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" id="modalContent"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/usuarios.js}"></script>
</body>
</html>
