<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONDIGTAL - Gestão de Visitantes</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="main-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar(currentPage='visitantes')}"></div>

    <div class="main-content">
        <header class="mobile-header">
            <button class="btn" id="sidebar-toggle-btn"><i class='bx bx-menu'></i></button>
            <span class="mobile-header-title">Gestão de Visitantes</span>
        </header>

        <div class="content-body p-4">
            <div class="page-header d-flex flex-column flex-md-row justify-content-md-between align-items-md-center mb-4">
                <div class="text-center text-md-start">
                    <h1 class="page-title">Gestão de Visitantes</h1>
                    <p class="page-subtitle d-none d-md-block">Controle de entrada e saída de visitantes.</p>
                </div>
                <div class="d-grid d-md-block mt-3 mt-md-0" th:if="${usuarioPodeGerenciarVisitantes}">
                    <button class="btn btn-primary" id="btnNovoVisitante">
                        <i class='bx bx-plus'></i> Novo Visitante
                    </button>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4 mb-4 d-none d-lg-flex">
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-encomenda-total"><i class='bx bx-id-card'></i></div><div><span class="label">Total Registros</span><span class="value" th:text="${totais['TOTAL'] ?: 0}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-ocupantes"><i class='bx bx-map-pin'></i></div><div><span class="label">No Local</span><span class="value" th:text="${totais['NO_LOCAL'] ?: 0}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-encomenda-retirada"><i class='bx bx-calendar-event'></i></div><div><span class="label">Entradas Hoje</span><span class="value" th:text="${totais['DO_DIA'] ?: 0}">0</span></div></div></div></div>
                <div class="col"><div class="card h-100"><div class="card-body d-flex align-items-center gap-3"><div class="card-icon icon-encomenda-devolvida"><i class='bx bx-log-out'></i></div><div><span class="label">Saídas Hoje</span><span class="value" th:text="${totais['SAIDAS_DIA'] ?: 0}">0</span></div></div></div></div>
            </div>

            <div class="card mb-4">
                <div class="card-body">
                    <form th:action="@{/visitantes}" method="get" class="row g-2 align-items-end">
                        <div class="col-12 col-md-6 col-lg"><label class="form-label">Buscar Visitante</label><input type="search" name="busca" class="form-control" placeholder="Nome do visitante..." th:value="${buscaFiltro}"></div>
                        <div class="col-12 col-md-6 col-lg" th:if="${showCondominioInfo}"><label class="form-label">Condomínio</label><select name="condominioId" class="form-select"><option value="">Todos</option><option th:each="c : ${condominiosDisponiveis}" th:value="${c.conCod}" th:text="${c.conNome}" th:selected="${c.conCod == condominioFiltro}"></option></select></div>
                        <div class="col-12 col-md-4 col-lg-auto"><label class="form-label">Unidade</label><select name="unidadeId" class="form-select"><option value="">Todas</option><option th:each="u : ${unidadesDisponiveis}" th:value="${u.uniCod}" th:text="${u.uniNumero} + (${u.bloco != null ? ' - ' + u.bloco : ''})" th:selected="${u.uniCod == unidadeFiltro}"></option></select></div>
                        <div class="col-12 col-md-4 col-lg-auto"><button type="submit" class="btn btn-secondary w-100"><i class='bx bx-filter-alt'></i> Filtrar</button></div>
                        <div class="col-12 col-md-4 col-lg-auto"><a th:href="@{/visitantes}" class="btn btn-outline-secondary w-100"><i class='bx bx-eraser'></i> Limpar</a></div>
                    </form>
                </div>
            </div>

            <div th:if="${visitantesPage.empty}" id="empty-placeholder" class="text-center p-5">
                <i class='bx bx-user-voice' style="font-size: 4rem; color: #ccc;"></i>
                <p class="mt-3">Nenhum visitante encontrado para os filtros selecionados.</p>
            </div>

            <div th:if="${not visitantesPage.empty}" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="lista-visitantes">
                <th:block th:each="vis : ${visitantesPage.content}">
                    <div th:replace="~{fragments/visitante-card :: card(vis=${vis}, showCondominioInfo=${showCondominioInfo}, usuarioPodeGerenciarVisitantes=${usuarioPodeGerenciarVisitantes})}"></div>
                </th:block>
            </div>

            <nav aria-label="Page navigation" th:if="${visitantesPage != null and visitantesPage.totalPages > 1}" class="mt-4 d-flex justify-content-center">
                <ul class="pagination">
                    <li class="page-item" th:classappend="${visitantesPage.first} ? 'disabled'"><a class="page-link" th:href="@{/visitantes(page=0, size=${visitantesPage.size}, condominioId=${condominioFiltro}, busca=${buscaFiltro}, unidadeId=${unidadeFiltro})}">Primeira</a></li>
                    <li class="page-item" th:classappend="${visitantesPage.first} ? 'disabled'"><a class="page-link" th:href="@{/visitantes(page=${visitantesPage.number - 1}, size=${visitantesPage.size}, condominioId=${condominioFiltro}, busca=${buscaFiltro}, unidadeId=${unidadeFiltro})}">Anterior</a></li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, visitantesPage.totalPages - 1)}" th:classappend="${i == visitantesPage.number} ? 'active'"><a class="page-link" th:href="@{/visitantes(page=${i}, size=${visitantesPage.size}, condominioId=${condominioFiltro}, busca=${buscaFiltro}, unidadeId=${unidadeFiltro})}" th:text="${i + 1}"></a></li>
                    <li class="page-item" th:classappend="${visitantesPage.last} ? 'disabled'"><a class="page-link" th:href="@{/visitantes(page=${visitantesPage.number + 1}, size=${visitantesPage.size}, condominioId=${condominioFiltro}, busca=${buscaFiltro}, unidadeId=${unidadeFiltro})}">Próxima</a></li>
                    <li class="page-item" th:classappend="${visitantesPage.last} ? 'disabled'"><a class="page-link" th:href="@{/visitantes(page=${visitantesPage.totalPages - 1}, size=${visitantesPage.size}, condominioId=${condominioFiltro}, busca=${buscaFiltro}, unidadeId=${unidadeFiltro})}">Última</a></li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="formModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content" id="modalContent">
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/visitantes.js}"></script>
</body>
</html>
