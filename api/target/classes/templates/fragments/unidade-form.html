<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="form-modal-content">
        <div class="modal-header">
            <h2 th:text="${unidadeId != null ? 'Editar Unidade ' + unidadeDTO.uniNumero : 'Nova Unidade'}">Título do Modal</h2>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        
        <form class="modal-form" th:object="${unidadeDTO}" 
              th:action="${unidadeId != null ? '/unidades/editar/' + unidadeId : '/unidades/salvar'}" 
              method="post">
            
            <input type="hidden" th:if="${unidadeId != null}" th:field="*{conCod}" />

            <div class="form-group" th:if="${unidadeId == null}">
                <label for="conCod">Condomínio *</label>
                <div th:if="${condominiosDisponiveis != null and condominiosDisponiveis.size() == 1}">
                    <input type="text" th:value="${condominiosDisponiveis[0].conNome}" disabled>
                    <input type="hidden" th:field="*{conCod}" th:value="${condominiosDisponiveis[0].conCod}">
                </div>
                <div th:if="${condominiosDisponiveis != null and condominiosDisponiveis.size() > 1}">
                    <select id="conCod" th:field="*{conCod}" required>
                        <option value="">Selecione o Condomínio...</option>
                        <option th:each="condo : ${condominiosDisponiveis}" th:value="${condo.conCod}" th:text="${condo.conNome}"></option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="uniNumero">Número da Unidade *</label>
                    <input type="text" id="uniNumero" th:field="*{uniNumero}" required>
                </div>
                <div class="form-group">
                    <label for="bloco">Bloco</label>
                    <input type="text" id="bloco" th:field="*{bloco}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="andar">Andar</label>
                    <input type="text" id="andar" th:field="*{andar}">
                </div>
                <div class="form-group">
                    <label for="fracaoIdeal">Fração Ideal *</label>
                    <input type="number" id="fracaoIdeal" step="0.0001" th:field="*{fracaoIdeal}" required>
                </div>
            </div>

            <div class="form-row">
                 <div class="form-group">
                    <label for="areaPrivada">Área Privativa (m²)</label>
                    <input type="number" id="areaPrivada" step="0.01" th:field="*{areaPrivada}">
                </div>
                <div class="form-group">
                    <label for="unidadeTipo">Tipo da Unidade</label>
                    <select id="unidadeTipo" th:field="*{unidadeTipo}">
                        <option value="">Selecione...</option>
                        <option th:each="tipo : ${tiposUnidade}" th:value="${tipo}" th:text="${tipo.getDescricao()}"></option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label for="statusOcupacao">Status</label>
                <select id="statusOcupacao" th:field="*{uniStatusOcupacao}">
                    <option th:each="s : ${statusOcupacao}" th:value="${s}" th:text="${s.getDescricao()}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="observacao">Observações</label>
                <textarea id="observacao" rows="3" th:field="*{observacao}"></textarea>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
                <button type="submit" class="btn-primary" th:text="${unidadeId != null ? 'Salvar Alterações' : 'Salvar'}">Salvar</button>
            </div>
        </form>
    </div>
</body>
</html>
